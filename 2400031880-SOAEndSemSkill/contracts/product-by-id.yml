name: get-product-by-id
description: Provider returns product details for a valid product ID.
request:
  method: GET
  url: /products/101
  headers:
    Accept: application/json
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    id: 101
    name: Laptop
    description: Business laptop
    price: 55000.0
